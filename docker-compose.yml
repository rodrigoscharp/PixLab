services:
  postgres-merchant:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merchant
      POSTGRES_USER: pixlab
      POSTGRES_PASSWORD: pixlab
    ports:
      - "${MERCHANT_DB_PORT:-5435}:5432"
    volumes:
      - postgres-merchant:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixlab -d merchant"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-psp:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psp
      POSTGRES_USER: pixlab
      POSTGRES_PASSWORD: pixlab
    ports:
      - "${PSP_DB_PORT:-5434}:5432"
    volumes:
      - postgres-psp:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixlab -d psp"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pixlab
      RABBITMQ_DEFAULT_PASS: pixlab
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Observabilidade (F7): docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pixlab.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

volumes:
  postgres-merchant:
  postgres-psp:
