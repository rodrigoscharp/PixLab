# Sobrescreve application.yml nos testes: nada de falar com um PSP de verdade rodando na máquina.
pixlab:
  psp:
    base-url: http://localhost:1
  consulta-ativa:
    enabled: false
  recon:
    enabled: false
management:
  # Só o exportador OTLP: desligar management.tracing.export também desliga a propagação do traceparent.
  tracing:
    export:
      otlp:
        enabled: false
