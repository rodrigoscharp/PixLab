spring:
  application:
    name: merchant-core
  datasource:
    url: jdbc:postgresql://localhost:${MERCHANT_DB_PORT:5435}/merchant
    username: pixlab
    password: pixlab
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${MERCHANT_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pixlab:
  psp:
    base-url: http://localhost:${PSP_PORT:8091}
    chave: recebedor@pixlab.dev
    webhook-url: http://localhost:${MERCHANT_PORT:8090}/webhook
    cob-expiracao: 1h
