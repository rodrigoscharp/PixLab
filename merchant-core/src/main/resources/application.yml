spring:
  application:
    name: merchant-core
  datasource:
    url: jdbc:postgresql://localhost:${MERCHANT_DB_PORT:5435}/merchant
    username: pixlab
    password: pixlab
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: pixlab
    password: pixlab
    publisher-confirm-type: simple
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${MERCHANT_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pixlab:
  psp:
    base-url: http://localhost:${PSP_PORT:8091}
    chave: recebedor@pixlab.dev
    webhook-url: http://localhost:${MERCHANT_PORT:8090}/webhook
    cob-expiracao: 1h
  inbox:
    workers: 4
    idle: 100ms
    max-attempts: 10
    backoff-base: 200ms
    backoff-max: 30s
