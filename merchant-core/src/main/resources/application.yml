spring:
  application:
    name: merchant-core
  datasource:
    url: jdbc:postgresql://localhost:${MERCHANT_DB_PORT:5435}/merchant
    username: pixlab
    password: pixlab
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: pixlab
    password: pixlab
    publisher-confirm-type: simple
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${MERCHANT_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

pixlab:
  psp:
    base-url: http://localhost:${PSP_PORT:8091}
    chave: recebedor@pixlab.dev
    webhook-url: http://localhost:${MERCHANT_PORT:8090}/webhook
    cob-expiracao: 1h
  inbox:
    workers: 4
    idle: 100ms
    max-attempts: 10
    backoff-base: 200ms
    backoff-max: 30s
  consulta-ativa:
    enabled: true
    interval: 30s
    window: 15m
  webhook:
    secret: ${PIXLAB_WEBHOOK_SECRET:pixlab-dev-secret}
  recon:
    enabled: true
    interval: 15m
    window: 1h
    lag: 5m
    chunk-size: 100
    page-size: 200
